name: Build CI Common public Maven offline dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-six-ci-common-offline.yml
      - pom-six-ci-common.xml
      - scripts/build-six-ci-common-cache.sh

permissions:
  contents: read

concurrency:
  group: public-maven-ci-common-cache
  cancel-in-progress: false

jobs:
  prepare:
    name: Public-only dependency resolution and extracted offline smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: maven:3.9.16-eclipse-temurin-25
    steps:
      - name: Checkout only this public cache-builder repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Java 25, Maven 3.9.16 and synthetic cache
        shell: bash
        run: bash scripts/build-six-ci-common-cache.sh

      - name: Upload temporary dependency-only ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: six-ci-common-maven-offline
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
