name: Build Six Security public Maven offline dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-six-security-offline.yml
      - pom-six-security.xml
      - scripts/build-six-security-cache.sh

permissions:
  contents: read

concurrency:
  group: public-maven-six-security-cache
  cancel-in-progress: false

jobs:
  prepare:
    name: Public Security dependencies and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: maven:3.9.16-eclipse-temurin-25
    steps:
      - name: Checkout only this public cache-builder repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install official Maven 3.10.2 with SHA-512 verification
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://dlcdn.apache.org/maven/maven-3/3.10.2/binaries"
          ARCHIVE="$RUNNER_TEMP/apache-maven-3.10.2-bin.tar.gz"
          curl -fsSL --retry 3 "$BASE/apache-maven-3.10.2-bin.tar.gz" -o "$ARCHIVE"
          curl -fsSL --retry 3 "$BASE/apache-maven-3.10.2-bin.tar.gz.sha512" -o "$ARCHIVE.sha512"
          expected="$(awk '{print $1}' "$ARCHIVE.sha512")"
          printf '%s  %s\n' "$expected" "$ARCHIVE" | sha512sum -c -
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.10.2/bin" >> "$GITHUB_PATH"

      - name: Resolve and verify public Security dependencies offline
        shell: bash
        run: bash scripts/build-six-security-cache.sh

      - name: Upload verified public Security cache
        uses: actions/upload-artifact@v4
        with:
          name: six-security-maven-offline
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
